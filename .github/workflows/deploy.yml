# Checks every push and pull request; deploys to the server when `prod` moves or a `prod*` tag is pushed.
#
# The repository is public, so the deploy is locked down (see "deploying" in the README):
# - its secrets are environment secrets of `production`, which only the prod branch and prod* tags may use,
#   so pull requests (forks included) and other branches never see them;
# - the key can do one thing on the server: its authorized_keys line forces ~/apps/pebblelab/release.sh,
#   which reads a build from stdin and installs it. No shell, no forwarding, no other commands;
# - third-party actions are pinned to commits.
# Environment secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS (ssh-keyscan -t ed25519 <host>), VPS_PORT (optional)
name: ci

on:
  push:
    branches: [master, prod]
    tags: ["prod", "prod-*", "prod/*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pebblelab
          POSTGRES_PASSWORD: pebblelab
          POSTGRES_DB: pebblelab
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U pebblelab" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked
        env:
          PEBBLELAB_TEST_DB: postgres://pebblelab:pebblelab@localhost:5432/pebblelab

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            ui -> target
      - name: wasm-bindgen and wasm-opt
        run: |
          v=$(grep -A1 'name = "wasm-bindgen"' ui/Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          curl -sSfL "https://github.com/rustwasm/wasm-bindgen/releases/download/$v/wasm-bindgen-$v-x86_64-unknown-linux-musl.tar.gz" | tar xz -C /tmp
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz" | tar xz -C /tmp
          echo "/tmp/wasm-bindgen-$v-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
          echo "/tmp/binaryen-version_123/bin" >> "$GITHUB_PATH"
      - run: cargo build --release --locked -p pebblelab
      - run: ui/build.sh
      - name: bundle
        run: |
          mkdir -p bundle/ui
          cp target/release/pebblelab bundle/
          cp -r ui/dist bundle/ui/dist
          echo "${GITHUB_SHA}" > bundle/REVISION
          tar czf pebblelab.tar.gz -C bundle .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pebblelab
          path: pebblelab.tar.gz
          retention-days: 14

  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/prod'))
    needs: [test, build]
    runs-on: ubuntu-24.04
    environment: production
    permissions: {}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pebblelab
      - name: deploy
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # the server's authorized_keys runs release.sh for this key whatever is asked; the revision is its argument
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "$PORT" "$USER@$HOST" "${GITHUB_SHA::12}" < pebblelab.tar.gz
          rm -f ~/.ssh/id_deploy
