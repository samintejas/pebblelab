# Checks every push and pull request. When master moves, it also publishes the build as a GitHub release, tagged
# prod-<date>-<commit>, with pebblelab.tar.gz attached. The server pulls it with deploy/pull.sh; nothing here can
# reach the server, so the workflow holds no secrets.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pebblelab
          POSTGRES_PASSWORD: pebblelab
          POSTGRES_DB: pebblelab
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U pebblelab" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked
        env:
          PEBBLELAB_TEST_DB: postgres://pebblelab:pebblelab@localhost:5432/pebblelab

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            ui -> target
      - name: wasm-bindgen and wasm-opt
        run: |
          v=$(grep -A1 'name = "wasm-bindgen"' ui/Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          curl -sSfL "https://github.com/rustwasm/wasm-bindgen/releases/download/$v/wasm-bindgen-$v-x86_64-unknown-linux-musl.tar.gz" | tar xz -C /tmp
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz" | tar xz -C /tmp
          echo "/tmp/wasm-bindgen-$v-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
          echo "/tmp/binaryen-version_123/bin" >> "$GITHUB_PATH"
      - run: cargo build --release --locked -p pebblelab
      - run: ui/build.sh
      - name: bundle
        run: |
          mkdir -p bundle/ui
          cp target/release/pebblelab bundle/
          cp -r ui/dist bundle/ui/dist
          echo "${GITHUB_SHA}" > bundle/REVISION
          tar czf pebblelab.tar.gz -C bundle .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pebblelab
          path: pebblelab.tar.gz
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pebblelab
      - name: tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="prod-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          sha256sum pebblelab.tar.gz > pebblelab.tar.gz.sha256
          gh release create "$tag" pebblelab.tar.gz pebblelab.tar.gz.sha256 \
            --target "$GITHUB_SHA" --title "$tag" --latest \
            --notes "Build of ${GITHUB_SHA}. On the server: ~/apps/pebblelab/pull.sh $tag (or with no tag for the latest)."
          echo "released $tag" >> "$GITHUB_STEP_SUMMARY"
